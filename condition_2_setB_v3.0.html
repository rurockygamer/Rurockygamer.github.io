<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #c8c7d4; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { width: 700px; background: #e0dfe8; border-radius: 10px; }
  .card-header { background: #5262d3; height: 116px; border-radius: 10px 10px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0 40px; }
  .card-header h1 { color: white; font-size: 36px; font-weight: 400; }
  .progress-bar { height: 6px; background: rgba(255,255,255,0.3); border-radius: 3px; width: 100%; }
  .progress-fill { height: 100%; background: white; border-radius: 3px; transition: width 0.3s; }
  .card-body { background: #f6f4f6; margin: 13px 20px; border-radius: 10px; box-shadow: 0 0 11px rgba(0,0,0,0.48); padding: 28px 36px 28px; display: flex; flex-direction: column; gap: 0; min-height: 735px; }
  .question-text { font-size: 32px; font-weight: 400; color: #1e1e1e; margin-bottom: 24px; line-height: 1.35; }
  .keyword { color: #5262d3; text-decoration: underline; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .keyword:hover { color: #3d4eb0; }
  .answers { display: flex; flex-direction: column; gap: 12px; }
  .ans { width: 100%; border: none; border-radius: 12px; height: 60px; display: flex; align-items: center; padding: 0 16px; cursor: pointer; text-align: left; transition: background 0.12s; }
  .ans-label { font-size: 24px; min-width: 48px; }
  .ans-text  { font-size: 24px; flex: 1; }
  .ans-icon  { font-size: 18px; margin-left: auto; flex-shrink: 0; }
  .ans-wrap  { display: flex; flex-direction: column; }
  .ans-default { background: #e2e2ea; }
  .ans-default:hover { background: #d4d3de; }
  .ans-default .ans-label, .ans-default .ans-text { font-weight: 400; color: #1e1e1e; }
  .ans-selected { background: #c8c7d8; border: 2px solid #5262d3 !important; }
  .ans-selected .ans-label, .ans-selected .ans-text { font-weight: 700; color: #5262d3; }
  .ans-correct-you { background: #c4d4be; border: 3px solid #2e4a36 !important; }
  .ans-correct-you.open { border-radius: 12px 12px 0 0; }
  .ans-correct-you .ans-label, .ans-correct-you .ans-text { font-weight: 700; color: #2e4a36; }
  .ans-correct-you .ans-icon { color: #2e4a36; }
  .ans-wrong-you { background: #e9c8d2; border: 2px solid #941d27 !important; }
  .ans-wrong-you.open { border-radius: 12px 12px 0 0; }
  .ans-wrong-you .ans-label, .ans-wrong-you .ans-text { font-weight: 700; color: #941d27; }
  .ans-wrong-you .ans-icon { color: #941d27; }
  .ans-correct-other { background: #dce8d8; border: 2px solid #8aad91 !important; cursor: pointer; }
  .ans-correct-other.open { border-radius: 12px 12px 0 0; }
  .ans-correct-other:hover { background: #cfdeca; }
  .ans-correct-other .ans-label, .ans-correct-other .ans-text { font-weight: 400; color: #42594a; }
  .ans-correct-other .ans-icon { color: #8aad91; }
  .ans-wrong-other { background: #dbd8e5; border: 2px solid #a099b5 !important; cursor: pointer; }
  .ans-wrong-other.open { border-radius: 12px 12px 0 0; }
  .ans-wrong-other:hover { background: #ccc9d8; }
  .ans-wrong-other .ans-label, .ans-wrong-other .ans-text { font-weight: 400; color: #6b6480; }
  .ans-wrong-other .ans-icon { color: #a099b5; }
  .exp-wrong   { background: #e6d5de; border: 2px solid #bf6975; border-top: none; border-radius: 0 0 12px 12px; padding: 14px 22px; font-size: 19px; color: #1e1e1e; line-height: 1.5; }
  .exp-wrong .lbl { color: #941d27; font-weight: 700; }
  .exp-correct { background: #bfcfba; border: 2px solid #6a9176; border-top: none; border-radius: 0 0 12px 12px; padding: 14px 22px; font-size: 19px; color: #1e1e1e; line-height: 1.5; }
  .exp-correct .lbl { color: #2e4a36; font-weight: 700; }
  .scaffold-panel { background: #eceaf5; border: 2px solid #5262d3; border-radius: 12px; margin-top: 20px; padding: 20px 24px 20px; display: flex; flex-direction: column; gap: 14px; }
  .scaffold-header { font-size: 22px; font-weight: 700; color: #5262d3; padding-bottom: 12px; border-bottom: 2px dashed #a0a8e0; }
  .scaffold-q-text { font-size: 21px; font-weight: 400; color: #1e1e1e; line-height: 1.4; }
  .scaffold-answers { display: flex; flex-direction: column; gap: 10px; }
  .sans { width: 100%; border: none; border-radius: 10px; height: 50px; display: flex; align-items: center; padding: 0 14px; cursor: pointer; text-align: left; transition: background 0.12s; }
  .sans-label { font-size: 20px; min-width: 40px; }
  .sans-text  { font-size: 20px; flex: 1; }
  .sans-icon  { font-size: 16px; margin-left: auto; flex-shrink: 0; }
  .sans-wrap  { display: flex; flex-direction: column; }
  .sans-default { background: #dddaf0; }
  .sans-default:hover { background: #ccc8e4; }
  .sans-default .sans-label, .sans-default .sans-text { color: #1e1e1e; font-weight: 400; }
  .sans-selected { background: #c4c0e2; border: 2px solid #5262d3 !important; }
  .sans-selected .sans-label, .sans-selected .sans-text { font-weight: 700; color: #3a46a8; }
  .sans-correct-you { background: #c4d4be; border: 3px solid #2e4a36 !important; }
  .sans-correct-you.open { border-radius: 10px 10px 0 0; }
  .sans-correct-you .sans-label, .sans-correct-you .sans-text { font-weight: 700; color: #2e4a36; }
  .sans-wrong-you { background: #e9c8d2; border: 2px solid #941d27 !important; }
  .sans-wrong-you.open { border-radius: 10px 10px 0 0; }
  .sans-wrong-you .sans-label, .sans-wrong-you .sans-text { font-weight: 700; color: #941d27; }
  .sans-correct-other { background: #d4e4d0; border: 2px solid #8aad91 !important; cursor: pointer; }
  .sans-correct-other.open { border-radius: 10px 10px 0 0; }
  .sans-correct-other:hover { background: #c6d9c1; }
  .sans-correct-other .sans-label, .sans-correct-other .sans-text { color: #42594a; }
  .sans-wrong-other { background: #d5d2e8; border: 2px solid #a099b5 !important; cursor: pointer; }
  .sans-wrong-other.open { border-radius: 10px 10px 0 0; }
  .sans-wrong-other:hover { background: #c5c2db; }
  .sans-wrong-other .sans-label, .sans-wrong-other .sans-text { color: #6b6480; }
  .sexp-wrong   { background: #e6d5de; border: 2px solid #bf6975; border-top: none; border-radius: 0 0 10px 10px; padding: 12px 18px; font-size: 17px; color: #1e1e1e; line-height: 1.5; }
  .sexp-wrong .lbl { color: #941d27; font-weight: 700; }
  .sexp-correct { background: #bfcfba; border: 2px solid #6a9176; border-top: none; border-radius: 0 0 10px 10px; padding: 12px 18px; font-size: 17px; color: #1e1e1e; line-height: 1.5; }
  .sexp-correct .lbl { color: #2e4a36; font-weight: 700; }
  .btn-return { align-self: flex-end; background: #5262d3; border: none; border-radius: 8px; color: white; font-size: 20px; font-weight: 600; padding: 12px 24px; cursor: pointer; margin-top: 4px; }
  .btn-return:hover { background: #3d4eb0; }
  .bottom-area { margin-top: auto; padding-top: 20px; }
  .btn-submit { display: block; margin: 0 auto 14px; background: #6372cd; border: none; border-radius: 7px; font-size: 30px; font-weight: 400; color: #f8f7fa; cursor: pointer; padding: 12px 30px; width: 324px; text-align: center; }
  .btn-submit:hover { background: #4d5db0; }
  .btn-submit:disabled { background: #e2e1e9; color: #aaa; cursor: default; }
  .btn-row { display: flex; align-items: center; justify-content: space-between; }
  .btn-back { background: transparent; border: none; font-size: 28px; color: #1e1e1e; cursor: pointer; padding: 10px; min-width: 100px; }
  .btn-back:hover { opacity: 0.6; }
  .btn-next { background: rgba(99,114,207,0.65); border: none; border-radius: 7px; font-size: 32px; color: #fffcfc; cursor: pointer; padding: 10px 20px; min-width: 140px; text-align: center; }
  .btn-next:hover { background: rgba(99,114,207,0.9); }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: #f6f4f6; border-radius: 14px; padding: 36px 40px; max-width: 480px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
  .modal h2 { font-size: 26px; color: #1e1e1e; margin-bottom: 14px; }
  .modal p  { font-size: 19px; color: #504b5f; line-height: 1.5; margin-bottom: 28px; }
  .modal-btns { display: flex; gap: 14px; }
  .modal-btn-go   { flex: 1; background: #6372cd; border: none; border-radius: 8px; font-size: 20px; color: white; cursor: pointer; padding: 14px; }
  .modal-btn-go:hover { background: #4d5db0; }
  .modal-btn-stay { flex: 1; background: #e2e2ea; border: none; border-radius: 8px; font-size: 20px; color: #1e1e1e; cursor: pointer; padding: 14px; }
  .modal-btn-stay:hover { background: #cccad8; }
  .score-screen { text-align: center; padding: 40px 20px; }
  .score-big { font-size: 80px; font-weight: 700; color: #5262d3; margin: 24px 0 8px; }
  .score-label { font-size: 28px; color: #1e1e1e; margin-bottom: 14px; }
  .score-breakdown { display: flex; flex-direction: column; gap: 10px; margin: 20px 0 30px; text-align: left; }
  .score-row { display: flex; justify-content: space-between; font-size: 18px; padding: 10px 16px; border-radius: 8px; background: #e8e7f0; }
  .score-row.ok   { background: #d2d9ce; color: #2e4a36; }
  .score-row.no   { background: #e9c8d2; color: #941d27; }
  .score-row.skip { background: #e2e2ea; color: #555; }
  .btn-restart { background: #5262d3; border: none; border-radius: 10px; font-size: 26px; color: white; cursor: pointer; padding: 14px 36px; }
  .btn-restart:hover { background: #4252b3; }
</style>
</head>
<body>
<div class="card" id="app"></div>
<div class="modal-bg" id="modal" style="display:none">
  <div class="modal">
    <h2>⚠️ Unanswered questions</h2>
    <p id="modal-msg"></p>
    <div class="modal-btns">
      <button class="modal-btn-stay" onclick="closeModal()">Go back</button>
      <button class="modal-btn-go"   onclick="forceScore()">See results anyway</button>
    </div>
  </div>
</div>
<script>
const Qs = [
  {
    num:1, title:"Question 1 — Monotonic Increasing",
    text:"A function is described as {monotonic increasing} on an interval. What does this mean?",
    keyword:"monotonic increasing",
    answers:[
      {l:"A",t:"The function never decreases as the input increases"},
      {l:"B",t:"The function increases and decreases repeatedly"},
      {l:"C",t:"The function reaches a maximum value"},
      {l:"D",t:"The function becomes undefined"}
    ],
    correct:"A",
    fb:{
      A:{ok:true, text:"A monotonic increasing function never decreases as the input increases. It may stay the same or increase, but it does not go down."},
      B:{ok:false,text:"If a function increases and decreases repeatedly, it is not monotonic. Monotonic functions do not change direction."},
      C:{ok:false,text:"A monotonic increasing function does not necessarily reach a maximum value. It simply does not decrease over the interval."},
      D:{ok:false,text:"Monotonic behavior describes how the function changes, not whether it becomes undefined."}
    },
    scaffold:{
      text:"If a function's output never goes down as the input increases, how does the function behave?",
      answers:[
        {l:"A",t:"It always increases or stays the same"},
        {l:"B",t:"It jumps randomly"},
        {l:"C",t:"It decreases rapidly"},
        {l:"D",t:"It repeats values"}
      ],
      correct:"A",
      fb:{
        A:{ok:true, text:"If the output never goes down as the input increases, the function is increasing or staying constant, which matches monotonic increasing behavior."},
        B:{ok:false,text:"Random jumps do not describe a monotonic pattern. Monotonic behavior is consistent in direction."},
        C:{ok:false,text:"If the output never goes down, then the function is not decreasing."},
        D:{ok:false,text:"Repeating values does not describe the key idea here. The important part is that the output does not go downward as input increases."}
      }
    }
  },
  {
    num:2, title:"Question 2 — Horizontal Asymptote",
    text:"A {horizontal asymptote} of a function describes:",
    keyword:"horizontal asymptote",
    answers:[
      {l:"A",t:"A value the function approaches but may never reach"},
      {l:"B",t:"The maximum height of the function"},
      {l:"C",t:"The slope of the function at every point"},
      {l:"D",t:"A point where the function becomes zero"}
    ],
    correct:"A",
    fb:{
      A:{ok:true, text:"A horizontal asymptote represents a value that the function approaches as the input grows large, even if the function never actually reaches it."},
      B:{ok:false,text:"A horizontal asymptote does not represent the maximum height of the function. The function may cross the asymptote or extend beyond it."},
      C:{ok:false,text:"The slope describes the derivative of a function, not an asymptote."},
      D:{ok:false,text:"A point where the function equals zero is called a root or intercept, not an asymptote."}
    },
    scaffold:{
      text:"If a graph gets closer and closer to a line but never touches it, what is happening?",
      answers:[
        {l:"A",t:"The graph approaches the line"},
        {l:"B",t:"The graph crosses the line"},
        {l:"C",t:"The graph becomes vertical"},
        {l:"D",t:"The graph repeats"}
      ],
      correct:"A",
      fb:{
        A:{ok:true, text:"If the graph gets closer and closer to a line, it is approaching that line."},
        B:{ok:false,text:"Crossing the line means the graph actually passes through it, which is different from only approaching it."},
        C:{ok:false,text:"Becoming vertical describes steepness or a vertical asymptote, not approaching a line horizontally."},
        D:{ok:false,text:"Repetition is not the key idea here. The important behavior is getting closer and closer to the line."}
      }
    }
  },
  {
    num:3, title:"Question 3 — Concave Up",
    text:"A function is {concave up} on an interval. What does this indicate about the graph?",
    keyword:"concave up",
    answers:[
      {l:"A",t:"The graph bends upward like a cup"},
      {l:"B",t:"The graph is decreasing everywhere"},
      {l:"C",t:"The graph has a vertical asymptote"},
      {l:"D",t:"The graph becomes discontinuous"}
    ],
    correct:"A",
    fb:{
      A:{ok:true, text:"When a graph is concave up, it curves upward, similar to the shape of a cup or bowl."},
      B:{ok:false,text:"Concavity describes the shape of the curve, not whether the function increases or decreases."},
      C:{ok:false,text:"A vertical asymptote describes where a function grows without bound, not the curvature of the graph."},
      D:{ok:false,text:"Concavity describes how a graph bends, while discontinuity refers to breaks or jumps in the graph."}
    },
    scaffold:{
      text:"If a curve bends upward like the inside of a bowl, how is it described?",
      answers:[
        {l:"A",t:"Concave up"},
        {l:"B",t:"Concave down"},
        {l:"C",t:"Linear"},
        {l:"D",t:"Discontinuous"}
      ],
      correct:"A",
      fb:{
        A:{ok:true, text:"A curve that bends upward like a bowl is described as concave up."},
        B:{ok:false,text:"Concave down is the opposite shape — it bends downward rather than upward."},
        C:{ok:false,text:"A linear graph is straight, so it does not bend upward or downward."},
        D:{ok:false,text:"Discontinuous means the graph has a break or jump, not a curved upward shape."}
      }
    }
  },
  {
    num:4, title:"Question 4 — Local Minimum",
    text:"A function has a {local minimum} at x = a. What does this mean?",
    keyword:"local minimum",
    answers:[
      {l:"A",t:"The function value at a is lower than nearby values"},
      {l:"B",t:"The function reaches its lowest value everywhere"},
      {l:"C",t:"The function becomes zero"},
      {l:"D",t:"The function becomes undefined"}
    ],
    correct:"A",
    fb:{
      A:{ok:true, text:"A local minimum occurs when the function value at a point is lower than the values immediately around it."},
      B:{ok:false,text:"That would be a global minimum. A local minimum only compares values near that point."},
      C:{ok:false,text:"A function becoming zero simply means the graph crosses the x-axis. That does not necessarily indicate a minimum."},
      D:{ok:false,text:"A local minimum describes a relative low point on the graph, not where the function is undefined."}
    },
    scaffold:{
      text:"If a point on a graph is lower than the values immediately around it, what kind of point is it?",
      answers:[
        {l:"A",t:"Minimum"},
        {l:"B",t:"Maximum"},
        {l:"C",t:"Asymptote"},
        {l:"D",t:"Intercept"}
      ],
      correct:"A",
      fb:{
        A:{ok:true, text:"If a point is lower than the nearby values, it is a minimum relative to that neighborhood."},
        B:{ok:false,text:"A maximum would be higher than the nearby values, not lower."},
        C:{ok:false,text:"An asymptote is a line the graph approaches, not a low point on the graph."},
        D:{ok:false,text:"An intercept is where the graph crosses an axis, which does not necessarily mean it is a low point."}
      }
    }
  }
];

let cur=0, sel=null, submitted=false, expanded=null;
let scaffoldOpen=false, sSel=null, sSubmitted=false, sExpanded=null;
let scores=new Array(Qs.length).fill(null);

function renderQText(q) {
  return q.text.replace(`{${q.keyword}}`,
    `<span class="keyword" onclick="openScaffold()">${q.keyword}</span>`);
}

function openScaffold() { scaffoldOpen=true; render(); setTimeout(()=>document.getElementById('scaffold-panel')?.scrollIntoView({behavior:'smooth',block:'nearest'}),50); }
function closeScaffold() { scaffoldOpen=false; render(); }

function render() {
  if (cur>=Qs.length) { renderScore(); return; }
  const q=Qs[cur], pct=(cur/Qs.length*100).toFixed(0);
  const app=document.getElementById('app');
  app.innerHTML=`
    <div class="card-header">
      <h1>${q.title}</h1>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="card-body">
      <p class="question-text">${renderQText(q)}</p>
      <div class="answers" id="ans-container"></div>
      ${scaffoldOpen?`<div class="scaffold-panel" id="scaffold-panel">
        <div class="scaffold-header">Scaffold question</div>
        <p class="scaffold-q-text">${q.scaffold.text}</p>
        <div class="scaffold-answers" id="sans-container"></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;margin-top:8px;">
          ${!sSubmitted?`<button id="s-submit-btn" class="btn-return" style="font-size:18px;padding:10px 20px;background:#b0b5d8;cursor:default;" disabled onclick="doSSubmit()">Submit ✓</button>`:''}
          <button class="btn-return" onclick="closeScaffold()">Return to Question ›</button>
        </div>
      </div>`:''}
      <div class="bottom-area">
        ${!submitted?`<button class="btn-submit" id="bsub" ${sel?'':'disabled'}>Submit Answer</button>`:''}
        <div class="btn-row">
          <button class="btn-back" onclick="goBack()">${cur>0?'← Back':''}</button>
          <button class="btn-next" onclick="goNext()">${cur<Qs.length-1?'Next →':'Finish'}</button>
        </div>
      </div>
    </div>`;
  if (!submitted) document.getElementById('bsub').onclick=doSubmit;
  renderAnswers(q);
  if (scaffoldOpen) renderScaffoldAnswers(q.scaffold);
}

function renderAnswers(q) {
  const c=document.getElementById('ans-container');
  if (!c) return;
  c.innerHTML='';
  q.answers.forEach(a=>{
    if (!submitted) {
      const btn=document.createElement('button');
      btn.className=`ans ${sel===a.l?'ans-selected':'ans-default'}`;
      btn.innerHTML=`<span class="ans-label">${a.l})</span><span class="ans-text">${a.t}</span>`;
      btn.onclick=()=>{ sel=a.l; render(); };
      c.appendChild(btn);
    } else {
      const isCorrect=a.l===q.correct, isYours=a.l===sel, isExp=expanded===a.l;
      let bCls,eCls,verdict,icon;
      if      (isCorrect&&isYours)  { bCls='ans-correct-you';   eCls='exp-correct'; verdict='Correct';   icon='✓'; }
      else if (!isCorrect&&isYours) { bCls='ans-wrong-you';     eCls='exp-wrong';   verdict='Incorrect'; icon='✕'; }
      else if (isCorrect)           { bCls='ans-correct-other'; eCls='exp-correct'; verdict='Correct';   icon='✓'; }
      else                          { bCls='ans-wrong-other';   eCls='exp-wrong';   verdict='Incorrect'; icon='✕'; }
      c.appendChild(mkWrap(a,bCls,isExp,eCls,verdict,q.fb[a.l].text,icon,'ans','toggleExp'));
    }
  });
}

function renderScaffoldAnswers(sc) {
  const c=document.getElementById('sans-container');
  if (!c) return;
  c.innerHTML='';
  sc.answers.forEach(a=>{
    if (!sSubmitted) {
      const btn=document.createElement('button');
      btn.className=`sans ${sSel===a.l?'sans-selected':'sans-default'}`;
      btn.innerHTML=`<span class="sans-label">${a.l})</span><span class="sans-text">${a.t}</span>`;
      btn.onclick=()=>{
        sSel=a.l; renderScaffoldAnswers(sc);
        const sb=document.getElementById('s-submit-btn');
        if(sb){sb.disabled=false;sb.style.background='#5262d3';sb.style.cursor='pointer';}
      };
      c.appendChild(btn);
    } else {
      const isCorrect=a.l===sc.correct, isYours=a.l===sSel, isExp=sExpanded===a.l;
      let bCls,eCls,verdict,icon;
      if      (isCorrect&&isYours)  { bCls='sans-correct-you';   eCls='sexp-correct'; verdict='Correct';   icon='✓'; }
      else if (!isCorrect&&isYours) { bCls='sans-wrong-you';     eCls='sexp-wrong';   verdict='Incorrect'; icon='✕'; }
      else if (isCorrect)           { bCls='sans-correct-other'; eCls='sexp-correct'; verdict='Correct';   icon='✓'; }
      else                          { bCls='sans-wrong-other';   eCls='sexp-wrong';   verdict='Incorrect'; icon='✕'; }
      c.appendChild(mkWrap(a,bCls,isExp,eCls,verdict,sc.fb[a.l].text,icon,'sans','toggleSExp'));
    }
  });
}

function mkWrap(a,btnCls,isExp,expCls,verdict,text,icon,prefix,toggleFn) {
  const wrap=document.createElement('div');
  wrap.className=`${prefix}-wrap`;
  wrap.innerHTML=`
    <button class="${prefix} ${btnCls} ${isExp?'open':''}" onclick="${toggleFn}('${a.l}')">
      <span class="${prefix}-label">${a.l})</span>
      <span class="${prefix}-text">${a.t}</span>
      <span class="${prefix}-icon">${isExp?'▲':icon}</span>
    </button>
    ${isExp?`<div class="${expCls}"><span class="lbl">${verdict}. </span>${text}</div>`:''}`;
  return wrap;
}

function toggleExp(l)  { expanded=expanded===l?null:l;  renderAnswers(Qs[cur]); }
function toggleSExp(l) { sExpanded=sExpanded===l?null:l; renderScaffoldAnswers(Qs[cur].scaffold); }

function doSubmit() {
  if (!sel) return;
  submitted=true;
  scores[cur]={selected:sel,isCorrect:sel===Qs[cur].correct};
  expanded=sel; render();
}

function doSSubmit() {
  if (!sSel) return;
  sSubmitted=true; sExpanded=sSel; render();
}

function goNext() {
  if (cur===Qs.length-1) {
    const unanswered=scores.reduce((acc,s,i)=>s===null?acc.concat(i+1):acc,[]);
    if (unanswered.length>0) {
      document.getElementById('modal-msg').textContent=
        `You haven't submitted question${unanswered.length>1?'s':''} ${unanswered.join(', ')}. Go back to answer ${unanswered.length===1?'it':'them'}, or see your results now (unanswered will be marked as skipped).`;
      document.getElementById('modal').style.display='flex';
      return;
    }
    cur=Qs.length; render(); return;
  }
  cur++; loadState();
}

function goBack() { if (cur===0) return; cur--; loadState(); }

function loadState() {
  const s=scores[cur];
  sel=s?s.selected:null; submitted=!!s; expanded=s?s.selected:null;
  scaffoldOpen=false; sSel=null; sSubmitted=false; sExpanded=null;
  render();
}

function closeModal() { document.getElementById('modal').style.display='none'; }
function forceScore() { closeModal(); cur=Qs.length; render(); }

function renderScore() {
  const app=document.getElementById('app');
  const total=Qs.length, correct=scores.filter(s=>s?.isCorrect).length;
  const skipped=scores.filter(s=>s===null).length;
  const pct=Math.round(correct/total*100);
  const msg=pct===100?"🎉 Perfect!":pct>=75?"Great job!":pct>=50?"Good effort — keep practicing!":"Keep studying!";
  const rows=Qs.map((q,i)=>{
    const s=scores[i];
    if(!s) return `<div class="score-row skip"><span>Q${i+1}: ${q.title.split('—')[1].trim()}</span><span>⏭ Skipped</span></div>`;
    return `<div class="score-row ${s.isCorrect?'ok':'no'}"><span>Q${i+1}: ${q.title.split('—')[1].trim()}</span><span>${s.isCorrect?'✓ Correct':'✕ Wrong'}</span></div>`;
  }).join('');
  app.innerHTML=`
    <div class="card-header"><h1>Results</h1><div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div></div>
    <div class="card-body">
      <div class="score-screen">
        <p style="font-size:22px;color:#504b5f">You scored</p>
        <div class="score-big">${correct}/${total}</div>
        <p class="score-label">${pct}% correct · ${skipped} skipped</p>
        <p style="font-size:20px;color:#504b5f;margin-bottom:16px">${msg}</p>
        <div class="score-breakdown">${rows}</div>
        <button class="btn-restart" onclick="restart()">Try Again</button>
      </div>
    </div>`;
}

function restart() {
  cur=0; sel=null; submitted=false; expanded=null;
  scaffoldOpen=false; sSel=null; sSubmitted=false; sExpanded=null;
  scores=new Array(Qs.length).fill(null);
  render();
}

render();
</script>
</body>
</html>
